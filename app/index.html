<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click&amp;Ready · Andes Market</title>
  <meta name="description" content="Compra online con retiro en tienda o entrega programada en Andes Market.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="config/entorno.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>

  <div class="franja-entorno" id="franja-entorno" hidden></div>

  <header class="cabecera">
    <div class="cabecera__fila contenedor">
      <a class="marca" href="#/" aria-label="Click&amp;Ready, ir al catálogo">
        <span class="marca__logo" aria-hidden="true">CR</span>
        <span class="marca__texto"><strong>Click&amp;Ready</strong><small>Andes Market</small></span>
      </a>

      <form class="buscador" id="buscador" role="search" autocomplete="off">
        <label class="oculto" for="buscador-texto">Buscar productos</label>
        <input id="buscador-texto" name="q" type="search" placeholder="Busca arroz, leche, detergente…"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugerencias">
        <button class="buscador__boton" type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6.5"/>
            <path d="m19.5 19.5-3.8-3.8"/>
          </svg>
        </button>
        <ul class="sugerencias" id="sugerencias" role="listbox" hidden></ul>
      </form>

      <div class="cabecera__acciones">
        <label class="selector-tienda">
          <span>Retiro en</span>
          <select id="selector-tienda" aria-label="Tienda de retiro"></select>
        </label>
        <div id="zona-usuario" class="zona-usuario"></div>
        <a class="btn-carrito" href="#/carrito" aria-label="Ver carrito">
          <span>Carrito</span>
          <span class="insignia" id="insignia-carrito">0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="vista" class="contenedor" tabindex="-1">
    <p class="cargando">Cargando catálogo…</p>
  </main>

  <footer class="pie">
    <div class="contenedor pie__fila">
      <span>Click&amp;Ready · MVP piloto en 3 tiendas de Santiago · Horario de retiro 10:00–19:00</span>
      <span><a href="sprint.html">Tablero del Sprint 1</a> · <span id="pie-version"></span></span>
    </div>
  </footer>

  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>
</body>
</html>
